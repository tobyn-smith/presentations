<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d">
<title id="t">Geddes Figure 1: selected NICs and East Asia</title>
<desc id="d">Two scatterplots compare labour repression and economic growth. The five selected newly industrialising countries all sit at repression score three, leaving little variation. The East Asia panel shows a positive association with r squared .56, but East Asia is itself a high-growth region.</desc>
<rect width="1500" height="600" fill="#fffdf8"/>
<text x="750" y="48" text-anchor="middle" fill="#102b43" font-family="Arial,sans-serif" font-size="31" font-weight="700">Figure 1 · Growth and labour repression</text>
<g fill="#102b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">
<text x="415" y="100" text-anchor="middle">Selected NICs</text>
<text x="1115" y="100" text-anchor="middle">East Asia</text>
</g>
<g stroke="#26394a" stroke-width="3" fill="none">
<path d="M130 390V135H700"/><path d="M830 390V135H1400"/>
</g>
<g stroke="#d9ddd9" stroke-width="1.5">
<path d="M130 326H700M130 262H700M130 198H700"/>
<path d="M830 326H1400M830 262H1400M830 198H1400"/>
</g>
<g fill="#142536" font-family="Arial,sans-serif" font-size="18">
<text x="95" y="395" text-anchor="end">0</text><text x="95" y="331" text-anchor="end">2</text><text x="95" y="267" text-anchor="end">4</text><text x="95" y="203" text-anchor="end">6</text><text x="95" y="141" text-anchor="end">8</text>
<text x="50" y="265" transform="rotate(-90 50 265)" text-anchor="middle">Growth in GNP per capita</text>
<text x="130" y="418" text-anchor="middle">1</text><text x="320" y="418" text-anchor="middle">2</text><text x="510" y="418" text-anchor="middle">3</text><text x="700" y="418" text-anchor="middle">4</text>
<text x="830" y="418" text-anchor="middle">1</text><text x="1020" y="418" text-anchor="middle">2</text><text x="1210" y="418" text-anchor="middle">3</text><text x="1400" y="418" text-anchor="middle">4</text>
<text x="415" y="450" text-anchor="middle" font-weight="700">Level of labour repression</text>
<text x="1115" y="450" text-anchor="middle" font-weight="700">Level of labour repression</text>
</g>
<g fill="#ba0c2f" stroke="#ba0c2f">
<circle cx="510" cy="170" r="8"/><circle cx="510" cy="190" r="8"/><circle cx="510" cy="210" r="8"/><circle cx="510" cy="280" r="8"/><circle cx="510" cy="320" r="8"/>
