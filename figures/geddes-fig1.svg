<text x="750" y="507" text-anchor="middle" fill="#f0d48a" font-family="Arial,sans-serif" font-size="22" font-weight="700">A pattern inside one group is not yet a general explanation</text>
<text x="750" y="570" text-anchor="middle" fill="#536475" font-family="Arial,sans-serif" font-size="15">Redrawn from Geddes (1990), Figure 1. Point positions reproduce the published pattern, not a new dataset.</text>
