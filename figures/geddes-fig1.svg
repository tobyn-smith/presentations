<circle cx="980" cy="335" r="8"/><circle cx="1015" cy="300" r="8"/><circle cx="1030" cy="280" r="8"/><circle cx="1190" cy="220" r="8"/><circle cx="1220" cy="210" r="8"/><circle cx="1280" cy="170" r="8"/><circle cx="1350" cy="300" r="8"/>
