<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d">
<title id="t">Geddes Figure 1: selected NICs and East Asia</title>
<desc id="d">Two scatterplots compare labour repression and economic growth. The five selected newly industrialising countries all sit at repression score three, leaving little variation. The East Asia panel shows a positive association with r squared .56, but East Asia is itself a high-growth region.</desc>
<rect width="1500" height="600" fill="#fffdf8"/>
<text x="750" y="48" text-anchor="middle" fill="#102b43" font-family="Arial,sans-serif" font-size="31" font-weight="700">Figure 1 · Growth and labour repression</text>
<g fill="#102b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">
<text x="415" y="100" text-anchor="middle">Selected NICs</text>
<text x="1115" y="100" text-anchor="middle">East Asia</text>
</g>
<g stroke="#26394a" stroke-width="3" fill="none">
<path d="M150 390V135H706"/><path d="M838 390V135H1394"/>
</g>
