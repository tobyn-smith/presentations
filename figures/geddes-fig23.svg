-size="17"><text x="95" y="590">1</text><text x="260" y="590">2</text><text x="430" y="590">3</text><text x="590" y="590">4</text><text x="795" y="590">1</text><text x="990" y="590">2</text><text x="1140" y="590">3</text><text x="1290" y="590">4</text><text x="350" y="630" text-anchor="middle">Level of labour repression</text><text x="1050" y="630" text-anchor="middle">Level of labour repression</text><text x="70" y="355" transform="rotate(-90 70 355)" text-anchor="middle">Growth</text><text x="770" y="355" transform="rotate(-90 770 355)" text-anchor="middle">Growth</text><text x="515" y="525" font-size="21" font-weight="700">r² = .07</text><text x="1215" y="525" font-size="21" font-weight="700">r² = .01</text></g><text x="700" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#536475">Redrawn schematically from Geddes (1990), Figures 2 and 3. Published r² values are retained; plotted positions are illustrative.</text></svg>