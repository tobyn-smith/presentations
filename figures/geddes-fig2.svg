<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 2: growth and labour repression in the Third World</title><desc id="d">A scatterplot with repression levels one to four and growth from minus two to eight. The fitted line slopes slightly downward, with r squared .07. Selected country labels include Jordan, India, Jamaica, Singapore, Syria, Argentina and Chile.</desc><rect width="1400" height="760" fill="#fffdf8"/><text x="700" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142536">Figure 2 · Growth and labour repression in the Third World</text><g stroke="#26394a" stroke-width="3" fill="none"><path d="M180 610V150H1260"/></g><g stroke="#b8c0c5" stroke-width="1.5"><path d="M180 242H1260M180 334H1260M180 426H1260M180 518H1260"/></g><path d="M180 430L1260 520" stroke="#ba0c2f" stroke-width="5" fill="none"/><g fill="#102b43"><circle cx="220" cy="190" r="8"/><circle cx="220" cy="485" r="8"/><circle cx="220" cy="540" r="8"/><circle cx="540" cy="315" r="8"/><circle cx="540" cy="380" r="8"/><circle cx="540" cy="445" r="8"/><circle cx="540" cy="500" r="8"/><circle cx="850" cy="190" r="8"/><circle cx="850" cy="270" r="8"/><circle cx="850" cy="350" r="8"/><circle cx="850" cy="410" r="8"/><circle cx="850" cy="465" r="8"/><circle cx="850" cy="540" r="8"/><circle cx="1180" cy="350" r="8"/><circle cx="1180" cy="450" r="8"/><circle cx="1180" cy="500" r="8"/><circle cx="1180" cy="560" r="8"/></g><g font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ba0c2f"><text x="240" y="180">Jordan</text><text x="240" y="490">India</text><text x="240" y="565">Jamaica</text><text x="870" y="175">Singapore</text><text x="1200" y="330">Syria</text><text x="1200" y="455">Argentina</text><text x="1200" y="590">Chile</text></g><g font-family="Arial,sans-serif" font-size="21" fill="#142536"><text x="180" y="650" text-anchor="middle">1</text><text x="540" y="650" text-anchor="middle">2</text><text x="900" y="650" text-anchor="middle">3</text><text x="1260" y="650" text-anchor="middle">4</text><text x="720" y="700" text-anchor="middle" font-size="24">Level of labour repression</text><text x="145" y="155" text-anchor="end">8</text><text x="145" y="247" text-anchor="end">6</text><text x="145" y="339" text-anchor="end">4</text><text x="145" y="431" text-anchor="end">2</text><text x="145" y="615" text-anchor="end">-2</text><text x="75" y="390" transform="rotate(-90 75 390)" text-anchor="middle" font-size="23">Growth in GNP per capita, 1960–1982</text><text x="1215" y="555" font-size="26" font-weight="700" fill="#ba0c2f">r² = .07</text></g><text x="700" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#536475">Redrawn from Geddes (1990), Figure 2. Point positions are illustrative; the reported fit and named cases are retained.</text></svg>