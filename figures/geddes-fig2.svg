<title id="t">Geddes Figure 2: growth and labour repression in the Third World</title>
<desc id="d">A scatterplot with an almost flat, slightly negative fitted line and reported r squared of .07. Named cases include Jordan, India, Jamaica, Singapore, Syria, Argentina and Chile. Point positions are illustrative.</desc>
