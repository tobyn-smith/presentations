<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 4: Skocpol's strategic contrasts</title><desc id="d">Two case comparison tables. An independent landed class that shares power can split the elite after external threat; village autonomy makes revolution more likely after an elite split.</desc><rect width="1400" height="650" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#142536"><text x="700" y="45" text-anchor="middle" font-size="30" font-weight="700">Figure 4 · Strategic contrasts in Skocpol</text><text x="350" y="105" text-anchor="middle" font-size="23" font-weight="700">External threat → elite response</text><text x="1050" y="105" text-anchor="middle" font-size="23" font-weight="700">Elite split → revolution</text></g><g stroke="#c9c3b7" stroke-width="2"><rect x="55" y="140" width="590" height="420" fill="#fff"/><path d="M55 215H645M350 140V560M55 385H645"/><rect x="755" y="140" width="590" height="420" fill="#fff"/><path d="M755 215H1345M1050 140V560M755 385H1345"/></g><g font-family="Arial,sans-serif" fill="#142536" font-size="18"><text x="200" y="185" text-anchor="middle" font-weight="700">Elite splits</text><text x="495" y="185" text-anchor="middle" font-weight="700">Elite stays cohesive</text><text x="350" y="255" text-anchor="middle" font-weight="700">Independent landed class</text><text x="350" y="290" text-anchor="middle">with an independent base</text><text x="200" y="335" text-anchor="middle">France</text><text x="200" y="365" text-anchor="middle">China after Taiping</text><text x="495" y="335" text-anchor="middle">Prussia</text><text x="495" y="365" text-anchor="middle">Japan</text><text x="350" y="425" text-anchor="middle" font-weight="700">Dependent landed class</text><text x="350" y="460" text-anchor="middle">or excluded from power</text><text x="495" y="500" text-anchor="middle">Russia before WWI</text><text x="200" y="500" text-anchor="middle">Russia after defeat in WWI</text><text x="900" y="185" text-anchor="middle" font-weight="700">No revolution</text><text x="1200" y="185" text-anchor="middle" font-weight="700">Revolution</text><text x="1050" y="255" text-anchor="middle" font-weight="700">Village autonomy</text><text x="900" y="325" text-anchor="middle">Low / dependent</text><text x="900" y="355" text-anchor="middle">Britain 1640–1660</text><text x="900" y="375" text-anchor="middle">Prussia 1848; China before</text><text x="900" y="405" text-anchor="middle">the Communists</text><text x="1200" y="325" text-anchor="middle">High / autonomous</text><text x="1200" y="355" text-anchor="middle">Russia; France</text><text x="1200" y="385" text-anchor="middle">Communist-controlled China</text></g><text x="700" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536475">Simplified visual summary of Geddes's Figure 4. The cases test different stages of the sequence.</text></svg>