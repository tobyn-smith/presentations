<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 4: Skocpol's strategic contrasts</title><desc id="d">Two case comparison tables: effect of external military threat on elite cohesion, and effect of elite split on probability of revolution.</desc><rect width="1400" height="620" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#142536"><text x="700" y="48" text-anchor="middle" font-size="30" font-weight="700">Figure 4 · Strategic contrasts in Skocpol</text><text x="350" y="105" text-anchor="middle" font-size="23" font-weight="700">External threat → elite cohesion</text><text x="1050" y="105" text-anchor="middle" font-size="23" font-weight="700">Elite split → revolution</text></g><g stroke="#c9c3b7" stroke-width="2"><rect x="55" y="140" width="590" height="390" fill="#fff"/><path d="M55 205H645M350 140V530M55 360H645"/><rect x="755" y="140" width="590" height="390" fill="#fff"/><path d="M755 205H1345M1050 140V530M755 360H1345"/></g><g font-family="Arial,sans-serif" fill="#142536" font-size="19"><text x="350" y="178" text-anchor="middle" font-weight="700">Elite remains cohesive</text><text x="200" y="178" text-anchor="middle" font-weight="700">Elite splits</text><text x="900" y="178" text-anchor="middle" font-weight="700">No revolution</text><text x="1200" y="178" text-anchor="middle" font-weight="700">Revolution</text><text x="200" y="250" font-weight="700">Independent landed class</text><text x="200" y="285">France; China after Taiping</text><text x="200" y="410" font-weight="700">Dependent landed class</text><text x="200" y="445">Prussia; Japan</text><text x="350" y="250" font-weight="700">Cases with threat</text><text x="350" y="285">Russia after WWI is the exception</text><text x="900" y="250" font-weight="700">Low village autonomy</text><text x="900" y="285">Britain 1640–1660; Prussia 1848</text><text x="1200" y="250" font-weight="700">High village autonomy</text><text x="1200" y="285">Russia; France; Communist areas</text><text x="900" y="410" font-weight="700">No revolution after split</text><text x="900" y="445">China before the Communists</text><text x="1200" y="410" font-weight="700">Revolution after split</text><text x="1200" y="445">China, Communist-controlled areas</text><text x="700" y="580" text-anchor="middle" font-size="16" fill="#536475">Simplified visual summary of Geddes's Figure 4; case placement follows the paper's discussion.</text></g></svg>