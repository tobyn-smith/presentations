<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 4: effect of external military threat on elite cohesion</title><desc id="d">A two-by-two matrix. Rows distinguish dominant classes that share power and have an independent economic base from dependent classes excluded from power. Columns distinguish elite splits from elites remaining cohesive. Cases are listed in the original cells.</desc><rect width="1600" height="760" fill="#fffdf8"/><text x="800" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142536">Figure 4 · Effect of external military threat</text><g font-family="Arial,sans-serif" fill="#142536"><text x="925" y="115" text-anchor="middle" font-size="27" font-weight="700">Elite splits</text><text x="1320" y="115" text-anchor="middle" font-size="27" font-weight="700">Elite remains cohesive</text></g><g stroke="#b8c0c5" stroke-width="3"><rect x="500" y="145" width="1000" height="490" rx="12" fill="#fff"/><path d="M1000 145V635M500 390H1500"/></g><g font-family="Arial,sans-serif" fill="#142536"><text x="60" y="225" font-size="25" font-weight="700">Dominant class</text><text x="60" y="265" font-size="24">economically</text><text x="60" y="305" font-size="24">independent;</text><text x="60" y="345" font-size="24">shares power</text><text x="60" y="485" font-size="25" font-weight="700">Dominant class</text><text x="60" y="525" font-size="24">dependent;</text><text x="60" y="565" font-size="24">excluded from</text><text x="60" y="605" font-size="24">power</text><text x="750" y="225" text-anchor="middle" font-size="31" font-weight="700">France</text><text x="750" y="275" text-anchor="middle" font-size="27">China after the</text><text x="750" y="315" text-anchor="middle" font-size="27">Taiping Rebellion</text><text x="1250" y="490" text-anchor="middle" font-size="30" font-weight="700">Prussia</text><text x="1250" y="535" text-anchor="middle" font-size="27">Japan</text><text x="1250" y="580" text-anchor="middle" font-size="25">China before Taiping</text><text x="1250" y="615" text-anchor="middle" font-size="25">Russia before World War I</text><text x="750" y="485" text-anchor="middle" font-size="30" font-weight="700">Russia, World War I</text></g><rect x="1015" y="160" width="470" height="210" rx="12" fill="#f5f1e7" stroke="#e0d6c4"/><text x="1250" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#536475">No cases listed in this cell</text><text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536475">Geddes's original Figure 4. Britain (Civil War) and Prussia (1848) are discussed separately as low-village-autonomy contrasts.</text></svg>