<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 4: Skocpol's strategic contrasts</title><desc id="d">Two paired comparisons. Independent landed classes with power can split the elite after external threat. High village autonomy makes revolution more likely after an elite split.</desc><rect width="1400" height="650" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#142536"><text x="700" y="48" text-anchor="middle" font-size="30" font-weight="700">Figure 4 · Strategic contrasts in Skocpol</text><text x="350" y="105" text-anchor="middle" font-size="23" font-weight="700">External threat → elite response</text><text x="1050" y="105" text-anchor="middle" font-size="23" font-weight="700">Elite split → revolution</text></g><g><rect x="55" y="140" width="275" height="420" rx="18" fill="#e7eee9" stroke="#9eafa5" stroke-width="2"/><rect x="350" y="140" width="295" height="420" rx="18" fill="#f3ead4" stroke="#d8c69f" stroke-width="2"/><rect x="755" y="140" width="275" height="420" rx="18" fill="#f3ead4" stroke="#d8c69f" stroke-width="2"/><rect x="1050" y="140" width="295" height="420" rx="18" fill="#e7eee9" stroke="#9eafa5" stroke-width="2"/></g><g font-family="Arial,sans-serif" fill="#142536"><text x="192" y="190" text-anchor="middle" font-size="22" font-weight="700">Elite splits</text><text x="192" y="245" text-anchor="middle" font-size="19">Independent landed class</text><text x="192" y="275" text-anchor="middle" font-size="19">with its own economic base</text><text x="192" y="340" text-anchor="middle" font-size="21">France</text><text x="192" y="375" text-anchor="middle" font-size="21">China after Taiping</text><text x="192" y="450" text-anchor="middle" font-size="17" fill="#536475">Russia after WWI is the</text><text x="192" y="475" text-anchor="middle" font-size="17" fill="#536475">exception: defeat breaks</text><text x="192" y="500" text-anchor="middle" font-size="17" fill="#536475">elite cohesion</text><text x="497" y="190" text-anchor="middle" font-size="22" font-weight="700">Elite stays cohesive</text><text x="497" y="245" text-anchor="middle" font-size="19">Dependent landed class</text><text x="497" y="275" text-anchor="middle" font-size="19">or excluded from power</text><text x="497" y="340" text-anchor="middle" font-size="21">Prussia</text><text x="497" y="375" text-anchor="middle" font-size="21">Japan</text><text x="497" y="450" text-anchor="middle" font-size="17" fill="#536475">Russia before WWI</text><text x="892" y="190" text-anchor="middle" font-size="22" font-weight="700">No revolution</text><text x="892" y="245" text-anchor="middle" font-size="19">Low village autonomy</text><text x="892" y="340" text-anchor="middle" font-size="21">Britain, 1640–1660</text><text x="892" y="375" text-anchor="middle" font-size="21">Prussia, 1848</text><text x="892" y="410" text-anchor="middle" font-size="19">China before Communists</text><text x="1197" y="190" text-anchor="middle" font-size="22" font-weight="700">Revolution</text><text x="1197" y="245" text-anchor="middle" font-size="19">High village autonomy</text><text x="1197" y="340" text-anchor="middle" font-size="21">Russia</text><text x="1197" y="375" text-anchor="middle" font-size="21">France</text><text x="1197" y="410" text-anchor="middle" font-size="19">Communist-controlled China</text></g><text x="700" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536475">Simplified visual summary of Geddes's Figure 4. The cases probe two different stages of the sequence.</text></svg>