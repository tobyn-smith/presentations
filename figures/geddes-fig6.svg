<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
<title id="t">Geddes Figure 6: Chilean inflation and the 1961 endpoint</title>
<desc id="d">Five selected Table 2 observations: 1955 84 percent, 1956 38 percent, 1957 17 percent, 1960 5 percent and 1961 10 percent. Geddes's Figure 6 extends to 1972, when inflation is above 100 percent. The dashed segment is schematic, not annual data.</desc>
<rect width="1600" height="620" rx="24" fill="#102b43"/>
<text x="70" y="60" fill="#f0d48a" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">FIGURE 6 · CHILE</text>
<text x="70" y="108" fill="#fffdf8" font-family="Arial,sans-serif" font-size="38" font-weight="700">The low inflation figures did not last</text>
<rect x="70" y="130" width="1460" height="390" rx="20" fill="#fffdf8"/>
<g stroke="#d8d6cf" stroke-width="2">
<path d="M190 435H1450M190 370H1450M190 305H1450M190 240H1450M190 175H1450"/>
</g>
<path d="M190 445V165H1450" stroke="#142536" stroke-width="3" fill="none"/>
<g fill="#142536" font-family="Arial,sans-serif" font-size="19">
<text x="160" y="450" text-anchor="end">0</text><text x="160" y="375" text-anchor="end">25</text><text x="160" y="310" text-anchor="end">50</text><text x="160" y="245" text-anchor="end">75</text><text x="160" y="180" text-anchor="end">100</text>
<text x="250" y="480" text-anchor="middle">1955</text><text x="475" y="480" text-anchor="middle">1956</text><text x="700" y="480" text-anchor="middle">1957</text><text x="960" y="480" text-anchor="middle">1960</text><text x="1120" y="480" text-anchor="middle">1961</text><text x="1430" y="480" text-anchor="middle">1972</text>
<text x="820" y="507" text-anchor="middle" font-size="21" font-weight="700">Year</text>
<text x="105" y="305" transform="rotate(-90 105 305)" text-anchor="middle" font-size="20">Inflation rate (%)</text>
</g>
<g fill="#ba0c2f" stroke="#ba0c2f"><circle cx="250" cy="226" r="11"/><circle cx="475" cy="346" r="11"/><circle cx="700" cy="400" r="11"/><circle cx="960" cy="432" r="11"/><circle cx="1120" cy="419" r="11"/></g>
<g fill="#102b43" font-family="Arial,sans-serif" font-size="21" font-weight="700">
<text x="250" y="202" text-anchor="middle">84%</text><text x="475" y="322" text-anchor="middle">38%</text><text x="700" y="376" text-anchor="middle">17%</text><text x="960" y="408" text-anchor="middle">5%</text><text x="1120" y="395" text-anchor="middle">10%</text>
</g>
<path d="M1120 419C1210 405 1310 295 1430 150" fill="none" stroke="#ba0c2f" stroke-width="6" stroke-dasharray="12 12"/>
<circle cx="1430" cy="150" r="12" fill="#ba0c2f"/>
<path d="M1120 160V455" stroke="#477e6a" stroke-width="4" stroke-dasharray="8 9"/>
<text x="1120" y="152" text-anchor="middle" fill="#477e6a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Hirschman's endpoint</text>
<rect x="1250" y="175" width="230" height="55" rx="14" fill="#f0d48a"/>
<text x="1365" y="210" text-anchor="middle" fill="#102b43" font-family="Arial,sans-serif" font-size="22" font-weight="700">1972 · above 100%</text>
<text x="800" y="585" text-anchor="middle" fill="#d9e0e4" font-family="Arial,sans-serif" font-size="17">Table 2's five selected observations are plotted exactly. The dashed extension is schematic, not an annual series.</text>
</svg>