<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Geddes's selection-bias thought experiment</title><desc id="d">Two scatterplots show how the full sample might have a positive relationship, or no relationship at all, even when only high-outcome cases A and B are studied.</desc><rect width="1100" height="760" fill="#fffdf8"/><text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142536">What the missing cases might look like</text><g font-family="Arial,sans-serif" fill="#142536" font-size="18"><text x="100" y="85" font-weight="700">Possible relationship across the full universe</text><text x="100" y="430" font-weight="700">But the full sample could look quite different</text></g><g stroke="#26394a" stroke-width="3" fill="none"><path d="M170 360V115H960"/><path d="M170 700V460H960"/></g><g stroke="#9aa5ad" stroke-width="2" stroke-dasharray="9 8"><path d="M170 205H960"/><path d="M170 550H960"/></g><g fill="#16324f"><circle cx="780" cy="140" r="8"/><circle cx="820" cy="150" r="8"/><circle cx="690" cy="185" r="8"/><circle cx="620" cy="210" r="8"/><circle cx="520" cy="235" r="8"/><circle cx="440" cy="255" r="8"/><circle cx="360" cy="280" r="8"/><circle cx="270" cy="320" r="8"/><circle cx="210" cy="335" r="8"/></g><g fill="#ba0c2f"><circle cx="850" cy="130" r="11"/><circle cx="890" cy="125" r="11"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#ba0c2f" font-weight="700"><text x="835" y="105">A</text><text x="895" y="105">B</text></g><g fill="#16324f"><circle cx="780" cy="480" r="8"/><circle cx="820" cy="500" r="8"/><circle cx="700" cy="535" r="8"/><circle cx="620" cy="560" r="8"/><circle cx="520" cy="590" r="8"/><circle cx="440" cy="620" r="8"/><circle cx="360" cy="650" r="8"/><circle cx="270" cy="675" r="8"/><circle cx="210" cy="690" r="8"/></g><g fill="#ba0c2f"><circle cx="850" cy="480" r="11"/><circle cx="890" cy="490" r="11"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#ba0c2f" font-weight="700"><text x="835" y="455">A</text><text x="895" y="465">B</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#536475"><text x="130" y="122">High</text><text x="130" y="360">Low</text><text x="130" y="468">High</text><text x="130" y="700">Low</text><text x="170" y="390">Low</text><text x="960" y="390" text-anchor="end">High</text><text x="170" y="735">Low</text><text x="960" y="735" text-anchor="end">High</text><text x="560" y="410" text-anchor="middle">Factor X</text><text x="560" y="755" text-anchor="middle">Factor X</text></g><text x="55" y="245" transform="rotate(-90 55 245)" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536475">Growth</text><text x="55" y="585" transform="rotate(-90 55 585)" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536475">Growth</text><text x="550" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#536475">Conceptual redraw of Geddes's selection-bias illustration. A and B are the selected high-outcome cases.</text></svg>