<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Geddes case matrix: one defeated country had a revolution, seven defeated cases did not, two revolutions occurred without the recorded defeat, and the remaining cases had neither outcome.">
  <rect width="1600" height="800" fill="#16324f"/>
  <rect width="1600" height="14" fill="#ba0c2f"/>
  <text x="84" y="72" fill="#f3d89a" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">FIGURE 5 · DEFEAT AND REVOLUTION</text>
  <text x="84" y="132" fill="#fffdf7" font-family="Arial, sans-serif" font-size="46" font-weight="700">Defeat alone does not explain revolution</text>
  <text x="84" y="178" fill="#d6d2c4" font-family="Arial, sans-serif" font-size="23">Geddes separates military defeat from revolutionary outcome.</text>

  <text x="650" y="230" fill="#f3d89a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" text-anchor="middle">REVOLUTION</text>
  <text x="1230" y="230" fill="#f3d89a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" text-anchor="middle">NO REVOLUTION</text>

  <rect x="70" y="250" width="300" height="210" rx="16" fill="#203f5a" stroke="#6d8295" stroke-width="2"/>
  <text x="220" y="340" fill="#fffdf7" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">DEFEATED</text>
  <text x="220" y="382" fill="#d6d2c4" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">in external war</text>

  <rect x="390" y="250" width="520" height="210" rx="16" fill="#f3ead4"/>
  <rect x="390" y="250" width="12" height="210" rx="6" fill="#ba0c2f"/>
  <text x="445" y="355" fill="#ba0c2f" font-family="Arial, sans-serif" font-size="82" font-weight="700">1</text>
  <text x="550" y="315" fill="#16324f" font-family="Arial, sans-serif" font-size="31" font-weight="700">BOLIVIA</text>
  <text x="550" y="362" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">Defeat in 1935</text>
  <text x="550" y="397" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">Revolution in 1952</text>

  <rect x="930" y="250" width="600" height="210" rx="16" fill="#fffdf7"/>
  <rect x="930" y="250" width="12" height="210" rx="6" fill="#ba0c2f"/>
  <text x="985" y="355" fill="#ba0c2f" font-family="Arial, sans-serif" font-size="82" font-weight="700">7</text>
  <text x="1090" y="315" fill="#16324f" font-family="Arial, sans-serif" font-size="29" font-weight="700">DEFEAT, NO REVOLUTION</text>
  <text x="1090" y="363" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">Peru 1839 · Bolivia 1839 · Mexico 1848</text>
  <text x="1090" y="400" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">Paraguay 1869 · Peru 1883 · Bolivia 1883/1903</text>

  <rect x="70" y="480" width="300" height="210" rx="16" fill="#203f5a" stroke="#6d8295" stroke-width="2"/>
  <text x="220" y="565" fill="#fffdf7" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">NOT</text>
  <text x="220" y="600" fill="#fffdf7" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">DEFEATED</text>
  <text x="220" y="640" fill="#d6d2c4" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">in external war</text>

  <rect x="390" y="480" width="520" height="210" rx="16" fill="#d5ddd0"/>
  <rect x="390" y="480" width="12" height="210" rx="6" fill="#ba0c2f"/>
  <text x="445" y="585" fill="#ba0c2f" font-family="Arial, sans-serif" font-size="82" font-weight="700">2</text>
  <text x="550" y="545" fill="#16324f" font-family="Arial, sans-serif" font-size="28" font-weight="700">REVOLUTION, NO DEFEAT</text>
  <text x="550" y="600" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">Mexico 1910 · Nicaragua 1979</text>

  <rect x="930" y="480" width="600" height="210" rx="16" fill="#e4e8e0"/>
  <rect x="930" y="480" width="12" height="210" rx="6" fill="#6d8295"/>
  <text x="990" y="555" fill="#16324f" font-family="Arial, sans-serif" font-size="31" font-weight="700">NEITHER OUTCOME</text>
  <text x="990" y="605" fill="#263c4d" font-family="Arial, sans-serif" font-size="24">All remaining cases in the comparison</text>

  <rect x="70" y="714" width="1460" height="58" rx="12" fill="#203f5a" stroke="#6d8295" stroke-width="1"/>
  <text x="94" y="751" fill="#fffdf7" font-family="Arial, sans-serif" font-size="20">10 country-period instances, not 10 unique countries. Bolivia appears more than once; Cuba (1959) is treated separately.</text>
</svg>