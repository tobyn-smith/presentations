<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 5: defeat in war and revolution</title><desc id="d">A two by two comparison. Seven defeats were not followed by revolution, one defeat was followed by revolution in Bolivia, two revolutions occurred without the specified defeat, and other non-revolution cases are listed.</desc><rect width="1200" height="620" fill="#fffdf8"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#142536">Figure 5 · Defeat in war and revolution</text><g stroke="#c9c3b7" stroke-width="3"><rect x="100" y="130" width="1000" height="380" fill="#fff"/><path d="M600 130V510M100 320H1100"/></g><g font-family="Arial,sans-serif" fill="#142536"><text x="350" y="105" text-anchor="middle" font-size="20" font-weight="700">No revolution</text><text x="850" y="105" text-anchor="middle" font-size="20" font-weight="700">Revolution</text><text x="120" y="185" font-size="18" font-weight="700">Defeated</text><text x="350" y="185" text-anchor="middle" font-size="25" font-weight="700">7 instances</text><text x="350" y="225" text-anchor="middle" font-size="18">Defeated, but no revolution</text><text x="350" y="265" text-anchor="middle" font-size="17">Peru, Bolivia, Mexico, Paraguay</text><text x="350" y="290" text-anchor="middle" font-size="17">and other listed cases</text><text x="850" y="185" text-anchor="middle" font-size="25" font-weight="700">1 instance</text><text x="850" y="225" text-anchor="middle" font-size="18">Bolivia: defeated in 1935,</text><text x="850" y="255" text-anchor="middle" font-size="18">revolution in 1952</text><text x="120" y="390" font-size="18" font-weight="700">Not defeated</text><text x="350" y="390" text-anchor="middle" font-size="25" font-weight="700">No revolution</text><text x="350" y="430" text-anchor="middle" font-size="18">Other countries without</text><text x="350" y="460" text-anchor="middle" font-size="18">the specified defeat</text><text x="850" y="390" text-anchor="middle" font-size="25" font-weight="700">2 instances</text><text x="850" y="430" text-anchor="middle" font-size="18">Mexico (1910); Nicaragua (1979)</text><text x="600" y="560" text-anchor="middle" font-size="16" fill="#536475">Geddes counts instances, not nine unique country labels. Cuba is treated as an intermediate case.</text></g></svg>