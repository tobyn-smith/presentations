<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 5: relationship between defeat in war and revolution</title><desc id="d">The original two-by-two case table listing all defeats and revolutions. Seven instances of defeat without revolution, two revolutions without the specified defeat, and one case that fits the argument, Bolivia.</desc><rect width="1600" height="850" fill="#fffdf8"/><text x="800" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142536">Figure 5 · Defeat in war and revolution</text><g font-family="Arial,sans-serif" fill="#142536"><text x="780" y="120" text-anchor="middle" font-size="29" font-weight="700">Revolution</text><text x="1260" y="120" text-anchor="middle" font-size="29" font-weight="700">No revolution</text></g><g stroke="#b8c0c5" stroke-width="3"><rect x="350" y="150" width="1150" height="500" rx="12" fill="#fff"/><path d="M925 150V650M350 410H1500"/></g><g font-family="Arial,sans-serif" fill="#142536"><text x="45" y="240" font-size="24" font-weight="700">Defeated and</text><text x="45" y="280" font-size="24">invaded or lost</text><text x="45" y="320" font-size="24">territory</text><text x="45" y="500" font-size="24" font-weight="700">Not defeated</text><text x="45" y="540" font-size="24">within 20 years</text><text x="640" y="220" text-anchor="middle" font-size="31" font-weight="700">Bolivia</text><text x="640" y="265" text-anchor="middle" font-size="27">Defeated 1935</text><text x="640" y="305" text-anchor="middle" font-size="27">Revolution 1952</text><text x="1210" y="210" text-anchor="middle" font-size="27" font-weight="700">Seven instances</text><text x="1210" y="255" text-anchor="middle" font-size="24">Peru, 1839 · Bolivia, 1839</text><text x="1210" y="295" text-anchor="middle" font-size="24">Mexico, 1848 · Paraguay, 1869</text><text x="1210" y="335" text-anchor="middle" font-size="24">Peru, 1883 · Bolivia, 1883</text><text x="1210" y="375" text-anchor="middle" font-size="24">Bolivia, 1903</text><text x="640" y="490" text-anchor="middle" font-size="28" font-weight="700">Two instances</text><text x="640" y="535" text-anchor="middle" font-size="25">Mexico, 1910</text><text x="640" y="575" text-anchor="middle" font-size="25">Nicaragua, 1979</text><text x="1210" y="520" text-anchor="middle" font-size="34" font-weight="700">All others</text></g><text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#142536">Cuba (1959) is an intermediate case. El Salvador, Peru and Guatemala had long insurgencies</text><text x="800" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#142536">that had not yet resulted in revolution at the time of Geddes's analysis.</text><text x="800" y="800" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536475">The threat threshold is defeat with invasion and/or territorial loss; the observation window is 20 years.</text></svg>