<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">Geddes Figure 5: defeat in war and revolution</title>
<desc id="d">A two-by-two case table. Seven defeat without revolution instances; two revolutions without the specified defeat; one instance of both, Bolivia; and all remaining cases in neither category. The observation window is twenty years. These are ten country-period instances, not ten unique countries. Cuba is intermediate and several insurgencies had not yet resulted in revolution at the time of analysis.</desc>
<rect width="1600" height="760" rx="24" fill="#102b43"/>
<text x="70" y="70" fill="#f0d48a" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">FIGURE 5 · THE WIDER CHECK</text>
<text x="70" y="126" fill="#fffdf8" font-family="Arial,sans-serif" font-size="38" font-weight="700">Defeat is not enough on its own to explain revolution</text>
<g fill="#f0d48a" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2"><text x="780" y="190" text-anchor="middle">REVOLUTION</text><text x="1260" y="190" text-anchor="middle">NO REVOLUTION</text></g>
<g>
<rect x="70" y="220" width="340" height="210" rx="18" fill="#183a57"/><rect x="70" y="450" width="340" height="210" rx="18" fill="#183a57"/>
<rect x="435" y="220" width="450" height="210" rx="18" fill="#f4ead2"/><rect x="905" y="220" width="625" height="210" rx="18" fill="#fffdf8"/>
<rect x="435" y="450" width="450" height="210" rx="18" fill="#dfe8e2"/><rect x="905" y="450" width="625" height="210" rx="18" fill="#fffdf8"/>
</g>
<g fill="#fffdf8" font-family="Arial,sans-serif"><text x="104" y="275" fill="#f0d48a" font-size="23" font-weight="700">DEFEATED</text><text x="104" y="320" font-size="26">Invaded and/or</text><text x="104" y="357" font-size="26">lost territory</text><text x="104" y="505" fill="#f0d48a" font-size="23" font-weight="700">NOT DEFEATED</text><text x="104" y="550" font-size="26">Within the</text><text x="104" y="587" font-size="26">20-year window</text></g>
<g font-family="Arial,sans-serif" fill="#102b43">
<text x="470" y="280" font-size="52" font-weight="700">1</text><text x="545" y="278" font-size="28" font-weight="700">BOLIVIA</text><text x="470" y="330" font-size="24">Defeated 1935</text><text x="470" y="366" font-size="24">Revolution 1952</text>
<text x="940" y="280" font-size="52" font-weight="700" fill="#ba0c2f">7</text><text x="1010" y="278" font-size="28" font-weight="700">DEFEAT, NO REVOLUTION</text><text x="940" y="335" font-size="23">Peru 1839 · Bolivia 1839 · Mexico 1848</text><text x="940" y="375" font-size="23">Paraguay 1869 · Peru 1883 · Bolivia 1883 · Bolivia 1903</text>
<text x="470" y="515" font-size="52" font-weight="700" fill="#477e6a">2</text><text x="545" y="513" font-size="28" font-weight="700">REVOLUTION, NO DEFEAT</text><text x="470" y="575" font-size="24">Mexico 1910</text><text x="470" y="615" font-size="24">Nicaragua 1979</text>
<text x="940" y="535" font-size="30" font-weight="700">NEITHER OUTCOME</text><text x="940" y="585" font-size="24" fill="#536475">All remaining cases in the comparison</text>
</g>
<rect x="70" y="685" width="1460" height="45" rx="12" fill="#f0d48a"/><text x="800" y="714" text-anchor="middle" fill="#102b43" font-family="Arial,sans-serif" font-size="19" font-weight="700">10 country-period instances, not 10 unique countries · Cuba is intermediate; some insurgencies were unresolved</text>
</svg>