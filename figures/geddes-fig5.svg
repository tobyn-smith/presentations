<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 5: relationship between defeat in war and revolution</title><desc id="d">The original two-by-two case table listing all defeat and revolution cases. Seven defeat/no-revolution instances, two revolutions without the specified defeat, and one case that fits the argument, Bolivia.</desc><rect width="1600" height="700" fill="#fffdf8"/><text x="800" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142536">Figure 5 · Defeat in war and revolution</text><g font-family="Arial,sans-serif" fill="#142536"><text x="770" y="108" text-anchor="middle" font-size="29" font-weight="700">Revolution</text><text x="1260" y="108" text-anchor="middle" font-size="29" font-weight="700">No revolution</text></g><g stroke="#b8c0c5" stroke-width="3"><rect x="350" y="130" width="1150" height="390" rx="12" fill="#fff"/><path d="M925 130V520M350 325H1500"/></g><g font-family="Arial,sans-serif" fill="#142536"><text x="35" y="210" font-size="24" font-weight="700">Defeated and</text><text x="35" y="250" font-size="24">invaded or lost</text><text x="35" y="290" font-size="24">territory</text><text x="35" y="400" font-size="24" font-weight="700">Not defeated</text><text x="35" y="440" font-size="24">within 20 years</text><text x="640" y="205" text-anchor="middle" font-size="31" font-weight="700">Bolivia</text><text x="640" y="250" text-anchor="middle" font-size="27">Defeated 1935</text><text x="640" y="290" text-anchor="middle" font-size="27">Revolution 1952</text><text x="1210" y="185" text-anchor="middle" font-size="28" font-weight="700">Seven instances</text><text x="1210" y="225" text-anchor="middle" font-size="24">Peru, 1839 · Bolivia, 1839</text><text x="1210" y="265" text-anchor="middle" font-size="24">Mexico, 1848 · Paraguay, 1869</text><text x="1210" y="305" text-anchor="middle" font-size="24">Peru, 1883 · Bolivia, 1883 · Bolivia, 1903</text><text x="640" y="390" text-anchor="middle" font-size="28" font-weight="700">Two instances</text><text x="640" y="435" text-anchor="middle" font-size="25">Mexico, 1910</text><text x="640" y="475" text-anchor="middle" font-size="25">Nicaragua, 1979</text><text x="1210" y="425" text-anchor="middle" font-size="34" font-weight="700">All others</text></g><text x="800" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#142536">Cuba (1959) is an intermediate case. El Salvador, Peru and Guatemala had long insurgencies</text><text x="800" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#142536">that had not yet resulted in revolution at the time of Geddes's analysis.</text><text x="800" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536475">The threshold is defeat with invasion and/or territorial loss; the observation window is 20 years.</text></svg>