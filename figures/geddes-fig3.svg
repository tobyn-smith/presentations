<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Geddes Figure 3: growth and labour repression in more advanced Third World countries</title><desc id="d">A scatterplot of more advanced Third World countries. The linear fit is almost flat, r squared .01, but the highest growth values cluster around repression level three. Geddes discusses a possible curved relationship or influence of a few unusually fast-growing NICs.</desc><rect width="1400" height="760" fill="#fffdf8"/><text x="700" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142536">Figure 3 · More advanced Third World countries</text><g stroke="#26394a" stroke-width="3" fill="none"><path d="M180 610V150H1260"/></g><g stroke="#b8c0c5" stroke-width="1.5"><path d="M180 242H1260M180 334H1260M180 426H1260M180 518H1260"/></g><path d="M180 405L1260 410" stroke="#ba0c2f" stroke-width="5" fill="none"/><g fill="#102b43"><circle cx="220" cy="550" r="8"/><circle cx="220" cy="490" r="8"/><circle cx="220" cy="460" r="8"/><circle cx="540" cy="330" r="8"/><circle cx="540" cy="385" r="8"/><circle cx="540" cy="430" r="8"/><circle cx="540" cy="510" r="8"/><circle cx="900" cy="185" r="8"/><circle cx="900" cy="225" r="8"/><circle cx="900" cy="260" r="8"/><circle cx="900" cy="365" r="8"/><circle cx="900" cy="405" r="8"/><circle cx="900" cy="470" r="8"/><circle cx="1260" cy="335" r="8"/><circle cx="1260" cy="460" r="8"/><circle cx="1260" cy="510" r="8"/><circle cx="1260" cy="565" r="8"/></g><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ba0c2f"><text x="925" y="165">Singapore</text><text x="925" y="215">Korea</text><text x="925" y="255">Taiwan</text><text x="555" y="315">Tunisia</text><text x="235" y="450">Panama</text><text x="235" y="575">Jamaica</text><text x="555" y="535">Peru</text><text x="925" y="390">Algeria</text><text x="1280" y="325">Syria</text><text x="1280" y="455">Argentina</text><text x="1280" y="590">Chile</text></g><g font-family="Arial,sans-serif" font-size="21" fill="#142536"><text x="180" y="650" text-anchor="middle">1</text><text x="540" y="650" text-anchor="middle">2</text><text x="900" y="650" text-anchor="middle">3</text><text x="1260" y="650" text-anchor="middle">4</text><text x="720" y="700" text-anchor="middle" font-size="24">Level of labour repression</text><text x="145" y="155" text-anchor="end">8</text><text x="145" y="247" text-anchor="end">6</text><text x="145" y="339" text-anchor="end">4</text><text x="145" y="431" text-anchor="end">2</text><text x="145" y="615" text-anchor="end">0</text><text x="75" y="390" transform="rotate(-90 75 390)" text-anchor="middle" font-size="23">Growth in GNP per capita, 1960–1982</text><text x="1190" y="555" font-size="26" font-weight="700" fill="#ba0c2f">r² = .01</text></g><text x="700" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#536475">Redrawn from Geddes (1990), Figure 3. Point positions are illustrative; the reported fit and named cases are retained.</text></svg>